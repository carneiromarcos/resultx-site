    <!-- Revelação ao rolar (src/hooks/useReveal.ts): liga .js-reveal antes da
         primeira pintura, nas mesmas condições do hook, para o conteúdo não
         piscar visível e depois sumir. O conteúdo é renderizado pelo mesmo
         bundle que observa a rolagem, então não há caso de texto escondido. -->
    <script>
      (function (root) {
        try {
          if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            root.classList.add("js-reveal");
          }
        } catch (e) {}
      })(document.documentElement);
    </script>
